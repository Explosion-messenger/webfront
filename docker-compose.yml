version: '3.8'

services:
  frontend:
    build: .
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      EMAIL: ${EMAIL:-no-reply@example.com}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - messenger_network

networks:
  messenger_network:
    external: true

volumes:
  caddy_data:
  caddy_config:
