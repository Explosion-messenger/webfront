name: Frontend CI/CD

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/messenger-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/messenger-frontend
            cd ~/messenger-frontend
            
            # Create a minimal docker-compose for the frontend
            cat <<EOF > docker-compose.yml
            version: '3.8'
            services:
              frontend:
                image: ghcr.io/${{ github.repository_owner }}/messenger-frontend:latest
                restart: always
                ports:
                  - "80:80"
                  - "443:443"
                environment:
                  DOMAIN: \${DOMAIN}
                  EMAIL: \${EMAIL}
                volumes:
                  - caddy_data:/data
                  - caddy_config:/config
                networks:
                  - messenger_network

            networks:
              messenger_network:
                external: true

            volumes:
              caddy_data:
              caddy_config:
            EOF

            # Create network if not exists
            docker network inspect messenger_network >/dev/null 2>&1 || docker network create messenger_network

            docker compose pull
            docker compose up -d
